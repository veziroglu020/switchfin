name: PORTMASTER_CUSTOM_ENGINE_V5_FIXED
on:
  workflow_dispatch: # Butonla çalıştır

jobs:
  arm64_custom_build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodları Çek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: QEMU Kurulumu
        uses: docker/setup-qemu-action@v3

      - name: Custom Engine Build (FFmpeg + MPV + Switchfin)
        run: |
          docker run --rm --privileged --platform linux/arm64 \
          -v ${{ github.workspace }}:/work \
          -w /work \
          ubuntu:22.04 /bin/bash -c "
          
          set -e
          export DEBIAN_FRONTEND=noninteractive
          
          # ---------------------------------------------------------
          # 1. HAZIRLIK
          # ---------------------------------------------------------
          echo '--- 1. TEMEL ARACLAR KURULUYOR ---'
          apt-get update
          apt-get install -y build-essential git pkg-config wget \
            python3-pip python3-setuptools python3-wheel ninja-build \
            nasm yasm \
            libsdl2-dev libcurl4-openssl-dev \
            libglm-dev libwebp-dev libfreetype6-dev libopus-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgles2-mesa-dev wayland-protocols libwayland-dev libxkbcommon-dev \
            libdrm-dev libudev-dev libz-dev libssl-dev libass-dev

          pip3 install meson

          # ---------------------------------------------------------
          # 2. FFMPEG 4.4.1 DERLEME (DÜZELTİLDİ)
          # ---------------------------------------------------------
          echo '--- 2. FFMPEG 4.4.1 DERLENIYOR ---'
          wget -qO- https://ffmpeg.org/releases/ffmpeg-4.4.1.tar.xz | tar Jxf - -C .
          cd ffmpeg-4.4.1
          
          # DÜZELTME: --enable-libudev KOMUTU KALDIRILDI (Hata sebebiydi)
          ./configure \
            --prefix=/usr \
            --enable-shared \
            --disable-static \
            --disable-programs --disable-debug --disable-avdevice \
            --enable-nonfree --enable-openssl --disable-doc --enable-libass --enable-zlib \
            --enable-libdrm \
            --disable-protocols --enable-protocol=file,http,tcp,udp,hls,https,tls,httpproxy \
            --disable-muxers --disable-encoders --enable-encoder=png \
            --arch=aarch64
          
          make -j\$(nproc)
          make install
          cd ..

          # ---------------------------------------------------------
          # 3. MPV 0.36.0 DERLEME
          # ---------------------------------------------------------
          echo '--- 3. MPV 0.36.0 DERLENIYOR ---'
          wget -qO- https://github.com/mpv-player/mpv/archive/v0.36.0.tar.gz | tar zxf - -C .
          cd mpv-0.36.0
          
          meson setup build \
            --prefix=/usr \
            --default-library=shared \
            -Dlibmpv=true \
            -Dcplayer=false \
            -Dtests=false \
            -Dlua=disabled \
            -Dlibarchive=disabled \
            -Dsdl2=enabled \
            -Dwayland=enabled \
            -Dgbm=enabled
            
          cd build && ninja && ninja install
          cd ../..

          # ---------------------------------------------------------
          # 4. SWITCHFIN DERLEME
          # ---------------------------------------------------------
          echo '--- 4. CMAKE VE SWITCHFIN ---'
          wget -q https://github.com/Kitware/CMake/releases/download/v3.29.0/cmake-3.29.0-linux-aarch64.sh -O cmake.sh
          sh cmake.sh --skip-license --prefix=/usr/local

          rm -rf build_sw && mkdir -p build_sw && cd build_sw
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_DESKTOP=ON \
            -DUSE_GLFW=ON \
            -DUSE_GL2=ON \
            -DCMAKE_C_FLAGS='-pthread' \
            -DCMAKE_CXX_FLAGS='-pthread'
          
          make -j\$(nproc)
          "

      - name: Dosyayı Paketle
        uses: actions/upload-artifact@v4
        with:
          name: Switchfin-Portmaster-CustomEngine-V5
          path: build_sw/Switchfin
