name: PORTMASTER_SWITCHFIN_MUOS_SAFE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with PortMaster Sysroot (muOS safe)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ghcr.io/portmaster-gui/portmaster-buildenv:latest \
            /bin/bash -c "

          set -e

          echo '=== PORTMASTER SYSROOT ACTIVE ==='
          echo \"SYSROOT: \$PORTMASTER_SYSROOT\"

          # -------------------------------------------------
          # FFMPEG (PORTMASTER ABI)
          # -------------------------------------------------
          wget -qO- https://ffmpeg.org/releases/ffmpeg-5.1.4.tar.xz | tar Jxf -
          cd ffmpeg-5.1.4

          ./configure \
            --prefix=\$PORTMASTER_SYSROOT/usr \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-debug \
            --disable-doc \
            --enable-zlib \
            --enable-libass \
            --enable-openssl \
            --disable-avdevice \
            --arch=aarch64

          make -j\$(nproc)
          make install
          cd ..

          # -------------------------------------------------
          # MPV (SDL ONLY — muOS SAFE)
          # -------------------------------------------------
          wget -qO- https://github.com/mpv-player/mpv/archive/v0.36.0.tar.gz | tar zxf -
          cd mpv-0.36.0

          meson setup build \
            --prefix=\$PORTMASTER_SYSROOT/usr \
            --default-library=shared \
            -Dlibmpv=true \
            -Dcplayer=false \
            -Dtests=false \
            -Dlua=disabled \
            -Dlibarchive=disabled \
            -Dsdl2=enabled \
            -Dwayland=disabled \
            -Dgbm=disabled \
            -Dx11=disabled \
            -Ddrm=disabled \
            -Degl=disabled \
            -Dgl=disabled

          ninja -C build
          ninja -C build install
          cd ..

          # -------------------------------------------------
          # SWITCHFIN (SDL BACKEND — muOS SAFE)
          # -------------------------------------------------
          rm -rf build_sw && mkdir build_sw && cd build_sw

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_DESKTOP=ON \
            -DUSE_GLFW=OFF \
            -DUSE_GL2=OFF \
            -DUSE_SDL2=ON \
            -DCMAKE_PREFIX_PATH=\$PORTMASTER_SYSROOT/usr \
            -DCMAKE_C_FLAGS='-pthread' \
            -DCMAKE_CXX_FLAGS='-pthread'

          make -j\$(nproc)
          cd ..

          # -------------------------------------------------
          # PACKAGE (PORTMASTER STYLE)
          # -------------------------------------------------
          mkdir -p dist/libs

          cp build_sw/Switchfin dist/

          # PortMaster sysroot libs
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libmpv.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libavcodec.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libavformat.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libavutil.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libswresample.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libswscale.so* dist/libs/ || true

          echo '=== BUILD COMPLETE (muOS SAFE) ==='
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Switchfin-PortMaster-muOS-SAFE
          path: dist/
