name: PORTMASTER_SWITCHFIN_V11_SYSROOT_DEBUG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable QEMU
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build with PortMaster Sysroot (DEBUG + SDL ONLY)
        run: |
          docker run --rm \
            --platform=linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ghcr.io/monkeyx-net/portmaster-build-templates/portmaster-builder:aarch64-latest \
            /bin/bash -c "

          set -e

          echo '=== DEBUG: FIND PORTMASTER SYSROOT ==='
          ls -l /opt || true
          find /opt -maxdepth 3 -type d | head -n 50 || true

          # Manuel SYSROOT ayarla (en yaygın path)
          export PORTMASTER_SYSROOT=/opt/portmaster/sysroot
          export PKG_CONFIG_PATH=\$PORTMASTER_SYSROOT/usr/lib/pkgconfig:\$PORTMASTER_SYSROOT/usr/share/pkgconfig
          export CMAKE_PREFIX_PATH=\$PORTMASTER_SYSROOT/usr

          echo \"SYSROOT=\$PORTMASTER_SYSROOT\"
          ls -l \$PORTMASTER_SYSROOT || true
          ls -l \$PORTMASTER_SYSROOT/usr || true

          # -------------------------------------------------
          # FFMPEG (NO LIBASS, SOFTWARE ONLY)
          # -------------------------------------------------
          wget -qO- https://ffmpeg.org/releases/ffmpeg-5.1.4.tar.xz | tar Jxf -
          cd ffmpeg-5.1.4

          ./configure \
            --prefix=\$PORTMASTER_SYSROOT/usr \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-debug \
            --disable-doc \
            --enable-zlib \
            --enable-openssl \
            --disable-avdevice \
            --disable-hwaccels \
            --disable-libass \
            --arch=aarch64

          make -j\$(nproc)
          make install
          cd ..

          # -------------------------------------------------
          # MPV (SDL ONLY)
          # -------------------------------------------------
          wget -qO- https://github.com/mpv-player/mpv/archive/v0.36.0.tar.gz | tar zxf -
          cd mpv-0.36.0

          meson setup build \
            --prefix=\$PORTMASTER_SYSROOT/usr \
            --default-library=shared \
            -Dlibmpv=true \
            -Dcplayer=false \
            -Dtests=false \
            -Dlua=disabled \
            -Dlibarchive=disabled \
            -Dsdl2=enabled \
            -Dwayland=disabled \
            -Dgbm=disabled \
            -Dx11=disabled \
            -Ddrm=disabled \
            -Degl=disabled \
            -Dgl=disabled

          ninja -C build
          ninja -C build install
          cd ..

          # -------------------------------------------------
          # SWITCHFIN (SDL BACKEND)
          # -------------------------------------------------
          rm -rf build_sw && mkdir build_sw && cd build_sw

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_DESKTOP=ON \
            -DUSE_GLFW=OFF \
            -DUSE_GL2=OFF \
            -DUSE_SDL2=ON \
            -DCMAKE_PREFIX_PATH=\$PORTMASTER_SYSROOT/usr

          make -j\$(nproc)
          cd ..

          # -------------------------------------------------
          # PACKAGE
          # -------------------------------------------------
          mkdir -p dist/libs

          cp build_sw/Switchfin dist/

          cp -d \$PORTMASTER_SYSROOT/usr/lib/libmpv.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libavcodec.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libavformat.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libavutil.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libswresample.so* dist/libs/ || true
          cp -d \$PORTMASTER_SYSROOT/usr/lib/libswscale.so* dist/libs/ || true

          echo '=== BUILD DONE (SYSROOT DEBUG, muOS SAFE) ==='
          "

      - uses: actions/upload-artifact@v4
        with:
          name: Switchfin-PortMaster-muOS-SYSROOT-DEBUG
          path: dist/
