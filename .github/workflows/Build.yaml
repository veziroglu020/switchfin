name: PORTMASTER_TURBO_BUILD_V9
on:
  workflow_dispatch:

jobs:
  arm64_turbo_build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: QEMU Kurulumu (ARM64 Taklidi İçin)
        uses: docker/setup-qemu-action@v3

      - name: Turbo Derleme (Ubuntu 24.04 - ARM64)
        run: |
          # --platform linux/arm64 SAYESİNDE SADECE CİHAZINA UYGUN DOSYALAR İNER
          docker run --rm --privileged --platform linux/arm64 \
          -v ${{ github.workspace }}:/work \
          -w /work \
          ubuntu:24.04 /bin/bash -c "
          
          set -e
          export DEBIAN_FRONTEND=noninteractive
          
          echo '--- 1. ARM64 KÜTÜPHANELERİ İNDİRİLİYOR ---'
          apt-get update
          # Bu komutla inen her şey %100 ARM64 uyumludur.
          apt-get install -y build-essential git pkg-config wget \
            libmpv-dev libsdl2-dev libcurl4-openssl-dev \
            libglm-dev libwebp-dev libfreetype6-dev libopus-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgles2-mesa-dev wayland-protocols libwayland-dev libxkbcommon-dev \
            libdrm-dev libudev-dev libz-dev libssl-dev libass-dev

          echo '--- 2. SWITCHFIN DERLENİYOR ---'
          wget -q https://github.com/Kitware/CMake/releases/download/v3.29.0/cmake-3.29.0-linux-aarch64.sh -O cmake.sh
          sh cmake.sh --skip-license --prefix=/usr/local

          rm -rf build_sw && mkdir -p build_sw && cd build_sw
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_DESKTOP=ON \
            -DUSE_GLFW=ON \
            -DUSE_GL2=ON \
            -DCMAKE_C_FLAGS='-pthread' \
            -DCMAKE_CXX_FLAGS='-pthread'
          
          make -j\$(nproc)
          cd ..

          echo '--- 3. DOSYALAR PAKETLENİYOR ---'
          mkdir -p dist/libs
          
          cp build_sw/Switchfin dist/
          
          # İndirilen ARM64 kütüphanelerini paketliyoruz
          echo 'Kütüphaneler kopyalanıyor...'
          cp -d /usr/lib/aarch64-linux-gnu/libmpv.so* dist/libs/ 2>/dev/null || true
          cp -d /usr/lib/aarch64-linux-gnu/libav*.so* dist/libs/ 2>/dev/null || true
          cp -d /usr/lib/aarch64-linux-gnu/libsw*.so* dist/libs/ 2>/dev/null || true
          cp -d /usr/lib/aarch64-linux-gnu/libpostproc.so* dist/libs/ 2>/dev/null || true
          cp -d /usr/lib/aarch64-linux-gnu/libplacebo.so* dist/libs/ 2>/dev/null || true
          
          echo 'Paketleme Tamam!'
          "

      - name: Dosyayı İndir
        uses: actions/upload-artifact@v4
        with:
          name: Switchfin-Portmaster-TURBO
          path: dist/
