name: PORTMASTER_FINAL_BUILD
on:
  push:
    branches: [ dev, main, master ] # Her kaydettiğinde çalışır
  workflow_dispatch:          # Butonla çalıştırır

jobs:
  arm64_build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: QEMU Setup
        uses: docker/setup-qemu-action@v3

      - name: Portmaster Derleme
        run: |
          docker run --platform linux/arm64 -v ${{ github.workspace }}:/work -w /work ubuntu:20.04 /bin/bash -c "
          export DEBIAN_FRONTEND=noninteractive && \
          apt-get update && apt-get install -y build-essential git pkg-config wget libmpv-dev libsdl2-dev libcurl4-openssl-dev libglm-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libx11-dev libwebp-dev libfreetype6-dev libopus-dev && \
          wget https://github.com/Kitware/CMake/releases/download/v3.29.0/cmake-3.29.0-linux-aarch64.sh -O cmake.sh && \
          sh cmake.sh --skip-license --prefix=/usr/local && \
          mkdir -p build && cd build && \
          cmake .. -DPLATFORM_DESKTOP=ON -DUSE_SDL2=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-pthread' -DCMAKE_CXX_FLAGS='-pthread' && \
          make -j2"

      - name: Dosyayı Paketle
        uses: actions/upload-artifact@v4
        with:
          name: Switchfin-Portmaster-ARM64
          path: build/Switchfin
