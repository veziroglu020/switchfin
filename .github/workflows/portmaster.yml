name: Build Portmaster ARM64
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/arm64
      - uses: addnab/docker-run-action@v3
        with:
          image: ubuntu:20.04
          options: --platform linux/arm64 -v ${{ github.workspace }}:/work -w /work
          run: /bin/bash -c "export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y build-essential git pkg-config wget libmpv-dev libsdl2-dev libcurl4-openssl-dev libglm-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libx11-dev libwebp-dev libfreetype6-dev libopus-dev && wget https://github.com/Kitware/CMake/releases/download/v3.29.0/cmake-3.29.0-linux-aarch64.sh -O cmake.sh && sh cmake.sh --skip-license --prefix=/usr/local && mkdir build && cd build && cmake .. -DPLATFORM_DESKTOP=ON -DUSE_SDL2=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-pthread' -DCMAKE_CXX_FLAGS='-pthread' && make -j2"
      - uses: actions/upload-artifact@v4
        with:
          name: Switchfin-Portmaster-ARM64
          path: build/Switchfin
