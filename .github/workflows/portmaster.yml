Tekrar Actions sekmesine git.

Sol tarafta "Build Portmaster (ARM64)" göreceksin. Ona tıkla ve sağ taraftaki "Run workflow" butonuna bas.

Yaklaşık 10-15 dakika sonra "Success" (Yeşil Tık) yandığında, dosyayı oradan indirebileceksin.

Yöntem 2: "Ben İnatçıyım, Bilgisayarımda Bitecek" Diyorsan 🛠️
Eğer GitHub ile uğraşmak istemezsen, aldığın Could NOT find WebP hatasını çözen ve emülatörün çökmemesi için ayarlanmış son Dockerfile burada.

Bunu Dockerfile içine yapıştır ve docker build -t switchfin-arm64 . komutunu ver.

Dockerfile
# Temel İmaj
FROM --platform=linux/arm64 ubuntu:20.04

# Ayarlar
ENV DEBIAN_FRONTEND=noninteractive
ENV TZ=Europe/Istanbul

# 1. Kütüphaneler (libwebp-dev EKLENDİ)
RUN apt-get update && apt-get install -y \
    build-essential git pkg-config wget \
    libmpv-dev libsdl2-dev libcurl4-openssl-dev libglm-dev \
    libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
    libx11-dev libxext-dev libxcursor-dev \
    libwebp-dev libfreetype6-dev libopus-dev \
    ca-certificates --no-install-recommends

# 2. CMake Kurulumu
RUN wget https://github.com/Kitware/CMake/releases/download/v3.29.0/cmake-3.29.0-linux-aarch64.sh -O cmake_installer.sh && \
    sh cmake_installer.sh --skip-license --prefix=/usr/local && \
    rm cmake_installer.sh

# 3. Kodları İndir
WORKDIR /build
RUN git clone --recursive https://github.com/dragonflylee/switchfin.git .

# 4. Derleme (Thread bayrağı EKLENDİ)
RUN mkdir build && cd build && \
    cmake .. \
    -DPLATFORM_DESKTOP=ON \
    -DUSE_SDL2=ON \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_C_FLAGS="-pthread" \
    -DCMAKE_CXX_FLAGS="-pthread" \
    -DCMAKE_EXE_LINKER_FLAGS="-lpthread"

# 5. Başlat (Çökmemesi için -j4 ile sınırlandı)
RUN cd build && make -j4
